<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Experience - ResumeCraft</title>

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="css/experience.css">

</head>

<body>


    <header class="header">

        <div class="container header-container">

            <a href="index.html"
                class="logo">

                Resume<span>Craft</span>

            </a>

            <div class="step-indicator">
                Step 4 of 6
            </div>

        </div>

    </header>


    <main class="form-page">

        <div class="container form-container">


            <div class="page-heading">

                <span>WORK EXPERIENCE</span>

                <h1>
                    Add Your Experience
                </h1>

                <p>
                    Add your work experience.
                    You can skip this if you are a fresher.
                </p>

            </div>


            <div id="experienceList">

                <!-- Experience cards added by JavaScript -->

            </div>


            <button id="addExperience"
                class="add-button">

                + Add Experience

            </button>


            <div class="skip-message">

                Freshers can continue without adding work experience.

            </div>


            <div class="form-actions">

                <button id="backButton"
                    class="back-button">

                    ← Back

                </button>


                <button id="nextButton"
                    class="next-button">

                    Save & Continue →

                </button>

            </div>


        </div>

    </main>


    <script src="js/experience.js"></script>

</body>

</html>
