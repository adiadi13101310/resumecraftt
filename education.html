<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Education - ResumeCraft</title>

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="css/education.css">

</head>

<body>


    <header class="header">

        <div class="container header-container">

            <a href="index.html"
                class="logo">

                Resume<span>Craft</span>

            </a>

            <div class="step-indicator">
                Step 3 of 6
            </div>

        </div>

    </header>


    <main class="form-page">

        <div class="container form-container">


            <div class="page-heading">

                <span>EDUCATION</span>

                <h1>
                    Add Your Education
                </h1>

                <p>
                    Add your school, college or university details.
                </p>

            </div>


            <div id="educationList">

                <!-- Education cards added by JavaScript -->

            </div>


            <button id="addEducation"
                class="add-button">

                + Add Education

            </button>


            <div class="form-actions">

                <button id="backButton"
                    class="back-button">

                    ← Back

                </button>


                <button id="nextButton"
                    class="next-button">

                    Save & Continue →

                </button>

            </div>


        </div>

    </main>


    <script src="js/education.js"></script>

</body>

</html>
